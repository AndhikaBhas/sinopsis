[package]
name = "sinopsis-worker-splicer"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
lapin = "2.3"
rusoto_core = "0.48"
rusoto_s3 = "0.48"
rusoto_credential = "0.48"
tokio-postgres = "0.7"
dotenv = "0.15"
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.0"
futures = "0.3"